name: Bootstrap npm lockfiles

on:
  push:
    branches:
      - ai/chatgpt-codex-desktop-shell
    paths:
      - .github/workflows/bootstrap-npm-locks.yml

permissions:
  contents: write

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Generate npm lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for workspace in im x xhs; do
            (
              cd "$workspace"
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            )
          done

      - name: Commit lockfiles and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im/package-lock.json x/package-lock.json xhs/package-lock.json
          git rm .github/workflows/bootstrap-npm-locks.yml
          git commit -m "build: generate npm lockfiles for existing workspaces"
          git push
